name: Production Stabilization 2026-07-27

on:
  push:
    branches:
      - agent/fix-universe-stress-lookback
    paths:
      - tools/apply_prod_stabilization_20260727.py
      - .github/workflows/prod-stabilization-20260727.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[prod-stabilization-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-universe-stress-lookback
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact surgical patches
        run: python tools/apply_prod_stabilization_20260727.py

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio

      - name: Run today's targeted regressions
        working-directory: backend
        run: |
          pytest -q tests/test_prod_stabilization_20260727.py tests/test_tick_time_scope.py

      - name: Run core engine regressions
        working-directory: backend
        run: pytest -q tests/test_engine.py

      - name: Commit validated stabilization batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/core/engine.py backend/app/brokers/alpaca.py backend/app/risk/market_regime.py backend/tests/test_prod_stabilization_20260727.py
          git rm tools/apply_prod_stabilization_20260727.py .github/workflows/prod-stabilization-20260727.yml
          git commit -m "fix(prod): stabilize broker lifecycle and reference-symbol safety [prod-stabilization-applied]"
          git push origin HEAD:agent/fix-universe-stress-lookback
