name: Go-live P0 regressions

on:
  push:
    branches:
      - fix/issue-22-restart-kill-switch-persistence
  pull_request:
    branches:
      - master

jobs:
  focused-p0-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r ../requirements.txt pytest

      - name: Run focused P0 regression suite
        run: >-
          python -m pytest -q
          tests/test_issue_20_same_cycle_reservations.py
          tests/test_issue_22_restart_kill_switch.py
          tests/test_issue_65_pdt_restart_durability.py
