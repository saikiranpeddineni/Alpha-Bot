name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run production invariant suite
        env:
          PYTHONPATH: backend
        run: >-
          pytest -q backend/tests
          --ignore=backend/tests/test_replay_loopholes.py
          -k 'not test_kelly_is_disabled_due_to_incompatibility and not test_backtest_uses_shared_allocation_path'
      - name: Run production integrity regressions explicitly
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_production_integrity.py
      - name: Run replay loophole invariants excluding local oracle fixture
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_replay_loopholes.py -k 'not july_6_10_oracle_regression'
