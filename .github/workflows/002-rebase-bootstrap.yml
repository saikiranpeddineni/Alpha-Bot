name: 002 rebase bootstrap

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-validated-002-patch:
    if: github.head_ref == '002-shared-decision-cycle-parity-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply exact validated 002 patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/app/core/engine.py')
          s = p.read_text()
          s = s.replace('                asyncio.create_task(self.run_market_scanner(is_intraday=False))', '                await self.run_market_scanner(is_intraday=False)')
          s = s.replace('                asyncio.create_task(self.run_market_scanner(is_intraday=True))', '                await self.run_market_scanner(is_intraday=True)')
          s = s.replace('                asyncio.create_task(self.run_event_monitor(now))', '                await self.run_event_monitor(now)')
          p.write_text(s)

          p = Path('backend/app/backtest/engine.py')
          s = p.read_text()
          old = '''        if portfolio.roll_session(session, broker.equity()):\n            risk.roll_session(session)\n\n        symbols_here = [s for s, idx in positions_index.items() if ts in idx]\n        for symbol in symbols_here:\n            i = positions_index[symbol][ts]\n            broker.process_bar(symbol, frames[symbol].iloc[i], now)\n            bars_processed += 1\n        drain(now)\n'''
          new = '''        symbols_here = [s for s, idx in positions_index.items() if ts in idx]\n        for symbol in symbols_here:\n            i = positions_index[symbol][ts]\n            broker.process_bar(symbol, frames[symbol].iloc[i], now)\n            bars_processed += 1\n        drain(now)\n\n        # Match the live decision cycle: observe/process all as-of-T fills first,\n        # then roll session state before account context, halts, and decisions.\n        # This makes a boundary fill on the first processed bar of D+1 land in\n        # identical portfolio/risk state in live and replay.\n        if portfolio.roll_session(session, broker.equity()):\n            risk.roll_session(session)\n'''
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('unexpected backtest decision-cycle source')
          p.write_text(s)

          test = Path('backend/tests/test_decision_cycle_parity.py')
          test.write_text('''from __future__ import annotations\n\nimport inspect\n\nfrom app.backtest import engine as backtest_engine\nfrom app.core.engine import TradingEngine\n\n\ndef _ordered(source: str, *needles: str) -> None:\n    offsets = [source.index(needle) for needle in needles]\n    assert offsets == sorted(offsets), list(zip(needles, offsets))\n\n\ndef test_live_decision_cycle_awaits_scanner_and_event_state_before_poll_and_decisions():\n    source = inspect.getsource(TradingEngine._tick)\n    assert "create_task(self.run_market_scanner" not in source\n    assert "create_task(self.run_event_monitor" not in source\n    _ordered(source, "await self.run_market_scanner(is_intraday=False)", "await self.run_event_monitor(now)", "new_closed = await self.data.poll(self.watchlist)", "await self._drain_fills(now)", "self.portfolio.roll_session(session, account.equity)", "halt = self.risk.check_halts(ctx, now=now)", "entries = await self._evaluate_symbol")\n\n\ndef test_replay_processes_and_drains_boundary_fills_before_session_roll_and_decisions():\n    source = inspect.getsource(backtest_engine.run_backtest)\n    loop = source[source.index("for step, ts in enumerate(all_ts):") :]\n    _ordered(loop, "outcome, scanned = await scanner.run(as_of=now)", "is_event, reason = await calendar.check(now, current_watchlist)", "broker.process_bar(symbol, frames[symbol].iloc[i], now)", "drain(now)", "portfolio.roll_session(session, broker.equity())", "ctx = account_ctx(now)", "halt = risk.check_halts(ctx, now=now)", "candidates_this_tick = []")\n''')
          PY
      - name: Validate patch before persistence
        env:
          PYTHONPATH: backend
        run: |
          python -m compileall -q backend/app
          pytest -q backend/tests/test_decision_cycle_parity.py backend/tests/test_production_integrity.py
          pytest -q backend/tests/test_replay_loopholes.py -k 'not oracle_regression'
      - name: Persist exact patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/core/engine.py backend/app/backtest/engine.py backend/tests/test_decision_cycle_parity.py
          git commit -m '002: reapply validated parity patch on merged 001' || exit 0
          git push origin HEAD:${{ github.head_ref }}
