name: Issue 012 engine patch
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.head_ref == '012-same-cycle-exposure-reservation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 012-same-cycle-exposure-reservation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/issue012_patch.py
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Focused reservation gate
        env: {PYTHONPATH: backend}
        run: pytest -q backend/tests/test_same_cycle_entry_reservations.py backend/tests/test_risk.py
      - name: Commit patched engine when needed
        run: |
          if git diff --quiet -- backend/app/core/engine.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/core/engine.py
          git commit -m "012 wire same-cycle exposure reservations"
          git push origin HEAD:012-same-cycle-exposure-reservation
