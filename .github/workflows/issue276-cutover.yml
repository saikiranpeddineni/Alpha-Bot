name: Issue 276 guarded cutover

on:
  push:
    branches: [agent/issue-276-shadow-event-boundary]
    paths:
      - scripts/issue276_engine_cutover.py
      - .github/workflows/issue276-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    if: ${{ !contains(github.event.head_commit.message, '[issue276-cutover]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-276-shadow-event-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply deterministic engine cutover
        run: python scripts/issue276_engine_cutover.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run issue 276 boundary tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_candidate_identity.py \
            backend/tests/test_canonical_outcome_joiner.py \
            backend/tests/test_exit_challenger_consumer.py \
            backend/tests/test_pipeline_shadow_isolation.py \
            backend/tests/test_research_zero_broker_boundary.py \
            backend/tests/test_shadow_event_boundary.py \
            backend/tests/test_shadow_event_builder.py \
            backend/tests/test_shadow_research_runtime.py \
            backend/tests/test_spawn_shadow_event_adapter.py \
            backend/tests/test_unified_evidence_store.py
      - name: Run production integrity regressions
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_production_integrity.py
      - name: Commit verified cutover
        run: |
          if git diff --quiet; then
            echo 'No cutover changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/core/engine.py
          git commit -m 'refactor: cut engine over to canonical shadow runtime [issue276-cutover]'
          git push origin HEAD:agent/issue-276-shadow-event-boundary
