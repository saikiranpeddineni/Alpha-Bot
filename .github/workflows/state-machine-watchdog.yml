name: State Machine Watchdog

on:
  pull_request:
    paths:
      - scripts/validate_engineering_ledger.py
      - tests/test_engineering_ledger_watchdog.py
      - .github/workflows/state-machine-watchdog.yml
  issue_comment:
    types: [created, edited]
  issues:
    types: [labeled, unlabeled]
  schedule:
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 pytest==9.0.2
      - name: Run watchdog invariant tests
        run: python -m pytest -q tests/test_engineering_ledger_watchdog.py
      - name: Validate engineering ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_engineering_ledger.py --repo "${{ github.repository }}"
