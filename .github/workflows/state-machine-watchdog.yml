name: State Machine Watchdog

on:
  pull_request:
    paths:
      - scripts/validate_engineering_ledger.py
      - tests/test_engineering_ledger_watchdog.py
      - .github/workflows/state-machine-watchdog.yml
  issue_comment:
    types: [created, edited]
  issues:
    types: [labeled, unlabeled]
  schedule:
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 pytest==9.0.2
      - name: Run watchdog invariant tests
        id: watchdog_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q tests/test_engineering_ledger_watchdog.py --junitxml=watchdog-tests.xml 2>&1 | tee watchdog-tests.log
      - name: Validate engineering ledger
        id: ledger_validation
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python scripts/validate_engineering_ledger.py --repo "${{ github.repository }}" 2>&1 | tee ledger-validation.log
      - name: Upload watchdog diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-diagnostics
          path: |
            watchdog-tests.log
            watchdog-tests.xml
            ledger-validation.log
          if-no-files-found: error
      - name: Enforce watchdog success
        if: always()
        run: |
          test "${{ steps.watchdog_tests.outcome }}" = success
          test "${{ steps.ledger_validation.outcome }}" = success
