name: Repair issue 036 PR branch
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.head_ref == '036-authoritative-eod-liquidation' && !contains(github.event.pull_request.title, '[036-direct-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 036-authoritative-eod-liquidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/issue036_direct_patch.py
      - run: pip install -r backend/requirements.txt
      - name: Focused regression gate
        working-directory: backend
        run: pytest -q tests/test_eod_liquidation_authority.py tests/test_decision_cycle_parity.py tests/test_gemini_engine_integration.py
      - name: Commit direct production path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/core/engine.py
          git rm backend/app/core/engine_legacy.py
          git commit -m "036 move EOD authority into production engine [036-direct]"
          git push origin HEAD:036-authoritative-eod-liquidation
